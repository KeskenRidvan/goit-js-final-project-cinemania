<div class="modal modal--video">
  <button class="modal__close" type="button" aria-label="Close" data-modal-close>
    <svg class="modal__close-icon">
      <use href="#icon-close"></use>
    </svg>
  </button>
  <iframe title="YouTube Video Player: Movie Trailer" class="modal__iframe"
    src="https://www.youtube.com/embed/{{trailer}}?autoplay=1" allow="autoplay; encrypted-media"
    allowfullscreen></iframe>
</div>
