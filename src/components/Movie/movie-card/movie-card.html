<div class="movie-card" data-id="{{id}}">
  <div class="movie-card__image-wrapper">
    <img src="{{poster}}" alt="{{title}}" class="movie-card__image" loading="lazy" />

    <div class="movie-card__overlay"></div>

    <div class="movie-card__info">
      <h3 class="movie-card__title">{{title}}</h3>

      <div class="movie-card__bottom-row">
        <p class="movie-card__meta">
          <span class="movie-card__genre">{{genres}}</span>
          <span class="movie-card__separator">|</span>
          <span class="movie-card__year">{{year}}</span>
        </p>

        {{starsList}}
      </div>
    </div>
  </div>
</div>
